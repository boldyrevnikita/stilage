version: '3.9'

networks:
  traefik:
    external: true

services:
  app:
    image: ${DOCKER_IMG}
    networks:
      - traefik
    dns: 100.64.0.32
    environment:
      RABBIT_HOST: 'rabbit'
      RABBIT_PORT: '5672'
      RABBIT_VHOST: 'stillage-api'
      RABBIT_USER: 'stillage-api'
      RABBIT_PASS: 'stillage-api'
      RABBIT_INPUT_QUEUE: 'model_task'
      RABBIT_OUTPUT_QUEUE: 'model_result'
      RABBIT_OUTPUT_ROUTING_KEY: 'model_result'
      RABBIT_HEARTBEAT: 1800
      PROCCESS_FUNC: 'ml'

      # S3 connection settings
      S3_ENDPOINT: 'https://minio.mlx-dev.necore.ru'
      S3_BUCKET_NAME: 'stillage'
      S3_DXF_FOLDER_NAME: 'dxf'
      S3_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      S3_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY

    deploy:
      resources:
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: 'NVIDIA-GPU'
                value: 1
      labels:
        nc-tag.project_url: $CI_PROJECT_URL
        nc-tag.pipeline_url: $CI_PIPELINE_URL
        nc-tag.commit_sha: $CI_COMMIT_SHA
        nc-tag.commit_branch: $CI_COMMIT_REF_NAME
        nc-tag.commit_title: $CI_COMMIT_TITLE
        nc-tag.commit_author: $CI_COMMIT_AUTHOR

